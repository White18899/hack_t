<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Gauntlet Forearm & Hand Outline -->
  <path d="M7 29 L25 29 L23 18 L26 12 C26 9 23 8 21 9 L20 7 C19 5 16 5 15 7 L14 6 C13 4 10 5 10 7 L9 8 C8 7 6 8 6 10 L7 18 Z" fill="url(#goldGrad)" stroke="#451a03" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Armor Segment Lines -->
  <path d="M8 24 L24 24 M9 20 L23 20" stroke="#78350f" stroke-width="0.8" />
  <path d="M12 14 L20 14" stroke="#78350f" stroke-width="0.8" />
  <!-- The 6 Infinity Stones -->
  <!-- Mind Stone (Large center on back of hand) -->
  <circle cx="16" cy="17" r="2.4" fill="#facc15" stroke="#ffffff" stroke-width="0.5" filter="url(#glow)"/>
  <!-- Power Stone (Purple - Pinky) -->
  <circle cx="9" cy="10" r="1.3" fill="#c084fc" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Space Stone (Blue - Ring finger) -->
  <circle cx="12.5" cy="8.5" r="1.3" fill="#38bdf8" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Reality Stone (Red - Middle finger) -->
  <circle cx="16" cy="8" r="1.3" fill="#f43f5e" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Time Stone (Green - Index finger) -->
  <circle cx="19.5" cy="8.5" r="1.3" fill="#4ade80" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Soul Stone (Orange - Thumb side) -->
  <circle cx="23" cy="11.5" r="1.3" fill="#fb923c" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Crosshair pointer dot at tip -->
  <circle cx="16" cy="3" r="1" fill="#ffffff" opacity="0.6"/>
</svg>
